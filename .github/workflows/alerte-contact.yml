name: Alerte demande de contact

# À chaque nouvelle « issue » portant l'étiquette « demande-contact » (créée par
# le formulaire du site), ce workflow publie un commentaire qui mentionne la
# personne responsable. Cette mention, émise par le robot github-actions,
# déclenche l'envoi d'un e-mail d'alerte (une mention par un autre acteur n'est
# pas filtrée, contrairement à ses propres actions).
#
# Prérequis : définir la variable de dépôt MAINTENEUR_GITHUB avec l'identifiant
# GitHub personnel à prévenir (Settings → Secrets and variables → Actions →
# Variables → New repository variable). Voir CONFIGURATION-FORMULAIRE.md.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  alerter:
    if: contains(github.event.issue.labels.*.name, 'demande-contact')
    runs-on: ubuntu-latest
    steps:
      - name: Notifier la personne responsable
        uses: actions/github-script@v7
        with:
          script: |
            const mainteneur = "${{ vars.MAINTENEUR_GITHUB }}";
            if (!mainteneur) {
              core.warning("Variable MAINTENEUR_GITHUB non définie : aucune mention envoyée.");
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${mainteneur} 📬 Nouvelle demande de contact reçue via le site.`
            });
